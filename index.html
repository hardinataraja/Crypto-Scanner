<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020605">
<title>CRYPTO CLAIM SCANNER</title>
<style>
:root{--bg:#020605;--p:#00ff66;--s:#00d9ff;--t:#d8ffe5;--dim:#5f8f73;--warn:#ffcc33;--bad:#ff4d6d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;-webkit-text-size-adjust:100%}
#mx{position:fixed;inset:0;width:100%;height:100%;opacity:.3;z-index:0}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 120px rgba(0,0,0,.7)}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:12px}
.term{background:rgba(2,6,5,.9);border:1px solid rgba(0,255,102,.4);border-radius:8px;box-shadow:0 0 24px rgba(0,255,102,.15);overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid rgba(0,255,102,.3);color:var(--dim);font-size:13px}
.bar i{width:11px;height:11px;border-radius:50%;background:var(--p);opacity:.8}.bar i:nth-child(2){background:var(--warn)}.bar i:nth-child(3){background:var(--bad)}
.bar b{margin-left:8px;color:var(--p);font-weight:600;flex:1}
.body{padding:16px}
h1{margin:0;font-size:clamp(22px,6vw,38px);letter-spacing:.04em;color:var(--p);text-shadow:0 0 12px rgba(0,255,102,.7)}
.sub{color:var(--s);text-shadow:0 0 8px rgba(0,217,255,.5);margin:2px 0 6px}
.on{color:var(--p)}.on::before{content:"● ";animation:bl 1.4s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
label{display:block;margin:16px 0 6px;color:var(--s);font-size:13px}
input,select,button{width:100%;font:inherit;font-size:16px;min-height:50px;padding:10px 12px;border-radius:4px;border:1px solid rgba(0,255,102,.5);background:#031009;color:var(--t);outline:none}
input:focus,select:focus{border-color:var(--s);box-shadow:0 0 10px rgba(0,217,255,.5)}
button{margin-top:16px;cursor:pointer;color:var(--bg);background:var(--p);border:0;font-weight:700;letter-spacing:.08em;box-shadow:0 0 16px rgba(0,255,102,.5)}
button:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent;color:var(--s);border:1px solid var(--s);box-shadow:none;margin-top:10px;min-height:44px;font-size:14px}
.row{display:grid;gap:12px}
@media(min-width:760px){.row{grid-template-columns:2fr 1fr}.row button{grid-column:1/-1}}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
#log{margin-top:18px;min-height:0;color:var(--p)}
#log .w{color:var(--warn)}#log .e{color:var(--bad)}
.cur::after{content:"█";animation:bl 1s steps(2) infinite;margin-left:2px}
#prog{color:var(--s);margin-top:8px;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{border:1px solid rgba(0,217,255,.35);padding:8px;border-radius:4px;text-align:center;color:var(--dim);font-size:12px}
.stats b{display:block;color:var(--s);font-size:18px}
.demo{margin-top:16px;border:1px double var(--warn);color:var(--warn);padding:10px 12px;text-align:center}
.card{position:relative;margin-top:14px;border:1px solid rgba(0,255,102,.45);border-radius:6px;padding:14px;background:rgba(0,255,102,.04);overflow:hidden}
.card h3{margin:6px 0 10px;font-size:17px;color:var(--p)}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.card dt{color:var(--dim)}.card dd{margin:0;text-align:right;word-break:break-word}
.st{font-weight:700}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(20px,6vw,34px);color:rgba(255,204,51,.17);transform:rotate(-14deg);pointer-events:none;line-height:1.2}
.acts{display:grid;gap:8px;margin-top:12px}
@media(min-width:560px){.acts{grid-template-columns:1fr 1fr}}
.acts a,.acts span{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--s);color:var(--s);text-decoration:none;border-radius:4px;font-size:14px}
.acts span{opacity:.4;border-color:var(--dim);color:var(--dim)}
.note{color:var(--dim);font-size:12px;margin-top:6px}
footer{margin-top:16px;color:var(--dim);font-size:12px}
@media(prefers-reduced-motion:reduce){.on::before,.cur::after{animation:none}}
</style>
</head>
<body>
<canvas id="mx"></canvas>
<div class="wrap"><div class="term">
<div class="bar"><i></i><i></i><i></i><b>CRYPTO CLAIM SCANNER</b><span>v1.0</span></div>
<div class="body">
<h1>CRYPTO CLAIM SCANNER</h1>
<div class="sub">ON-CHAIN CLAIM DISCOVERY TOOL</div>
<div class="on">SYSTEM ONLINE</div>

<div class="row">
<div><label for="wallet">WALLET ADDRESS</label>
<input id="wallet" placeholder="0x..." autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text"></div>
<div><label for="chain">BLOCKCHAIN</label>
<select id="chain">
<option value="bsc">BSC</option><option value="base">Base</option>
<option disabled>Ethereum - COMING SOON</option><option disabled>Polygon - COMING SOON</option><option disabled>Arbitrum - COMING SOON</option>
</select></div>
<button id="go">START SCAN</button>
</div>
<button id="useW" class="ghost" hidden>USE MY BROWSER WALLET ADDRESS</button>

<pre id="log" class="cur"><span>$ _</span></pre>
<pre id="prog"></pre>
<div id="out"></div>
<footer>Non-custodial. Tidak pernah meminta private key / seed phrase. Tidak ada transaksi otomatis. Status UNKNOWN berarti belum dapat diverifikasi, bukan berarti aman.</footer>
</div></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* Matrix rain (ringan: ~16fps, berhenti saat tab tidak aktif) */
(function(){
  const c=$("mx"),x=c.getContext("2d"),ch="01ABCDEF>/\\$#@",fs=18;let cols,d,last=0;
  function rs(){c.width=innerWidth;c.height=innerHeight;cols=Math.ceil(c.width/fs);d=Array.from({length:cols},()=>Math.random()*-40)}
  function f(t){requestAnimationFrame(f);if(document.hidden||t-last<65)return;last=t;
    x.fillStyle="rgba(2,6,5,.16)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff66";x.font=fs+"px monospace";
    for(let i=0;i<cols;i++){if(d[i]>=0)x.fillText(ch[Math.random()*ch.length|0],i*fs,d[i]*fs);
      if(d[i]*fs>c.height&&Math.random()>.975)d[i]=0;d[i]++}}
  rs();addEventListener("resize",rs);
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches)requestAnimationFrame(f);
})();

/* Browser wallet (hanya mengisi alamat, tidak ada transaksi) */
if(window.ethereum){
  $("useW").hidden=false;
  $("useW").onclick=async()=>{try{const a=await window.ethereum.request({method:"eth_requestAccounts"});if(a&&a[0])$("wallet").value=a[0]}catch(e){}};
}

const STEPS=["Initializing scanner...","Validating wallet...","Loading blockchain configuration...","Connecting to network...","Loading claim registry...","Searching claim contracts...","Detecting claim mechanism...","Checking wallet eligibility...","Checking deadlines...","Calculating estimated value...","Finalizing results..."];
const ST={CLAIMABLE:["🟢","var(--p)"],POSSIBLE:["🟡","var(--warn)"],EXPIRED:["🔴","var(--bad)"],CLAIMED:["🔵","var(--s)"],UNKNOWN:["⚪","var(--t)"]};
const DEMO=[
 {name:"XYZ AIRDROP",token:"XYZ",status:"CLAIMABLE",claimable:"12,450 XYZ",valueUsd:84.2,gasUsd:0.12,deadline:"2026-12-15",risk:"UNKNOWN",demo:true},
 {name:"SAMPLE REDEEM",token:"SMP",status:"UNKNOWN",claimable:null,valueUsd:null,gasUsd:null,deadline:null,risk:"UNKNOWN",demo:true}
];

function log(t,cls){const l=$("log");l.classList.remove("cur");l.insertAdjacentHTML("beforeend","\n<span class='"+(cls||"")+"'>"+esc(t)+"</span>");}
function bar(p){const n=Math.round(p/5);$("prog").textContent="["+"█".repeat(n)+"░".repeat(20-n)+"] "+p+"%"}
function usd(v){return v==null?"UNKNOWN":"$"+Number(v).toFixed(2)}

async function callApi(wallet,chain){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),9000);
  try{
    const r=await fetch("/api/server",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({wallet,chain}),signal:ac.signal});
    if(!r.ok)return null;
    const j=await r.json();
    return j&&j.success&&Array.isArray(j.results)?j:null;
  }catch(e){return null}finally{clearTimeout(t)}
}

function card(r,chainName){
  const s=ST[r.status]||ST.UNKNOWN;
  const net=(r.gasUsd!=null&&r.valueUsd!=null)?usd(r.valueUsd-r.gasUsd):"UNKNOWN";
  const gas=r.gasUsd!=null?"~"+usd(r.gasUsd):(r.gasNative!=null?"~"+r.gasNative.toFixed(6)+" "+esc(r.gasSymbol||""):"UNKNOWN");
  const acts=r.demo?"<span>VIEW CONTRACT (demo)</span><span>CHECK CLAIM (demo)</span>"
    :(r.explorer?"<a href='"+esc(r.explorer)+"' target='_blank' rel='noopener noreferrer'>VIEW CONTRACT</a>":"<span>VIEW CONTRACT</span>")+"<span>CHECK CLAIM - use official site</span>";
  return "<div class='card'>"+(r.demo?"<div class='wm'>DEMO RESULT<br>NOT A REAL CLAIM</div>":"")+
   "<div class='st' style='color:"+s[1]+"'>"+s[0]+" "+esc(r.status)+"</div><h3>"+esc(r.name)+"</h3><dl>"+
   "<dt>Token</dt><dd>"+esc(r.token||"UNKNOWN")+"</dd>"+
   "<dt>Claimable</dt><dd>"+esc(r.claimable||"UNKNOWN")+"</dd>"+
   "<dt>Estimated</dt><dd>"+usd(r.valueUsd)+"</dd>"+
   "<dt>Gas</dt><dd>"+gas+"</dd>"+
   "<dt>Potential net</dt><dd>"+net+"</dd>"+
   "<dt>Deadline</dt><dd>"+esc(r.deadline||"UNKNOWN")+"</dd>"+
   "<dt>Network</dt><dd>"+esc(chainName)+"</dd>"+
   "<dt>Risk</dt><dd>"+esc(r.risk||"UNKNOWN")+"</dd></dl>"+
   (r.notes&&r.notes.length?"<div class='note'>"+r.notes.map(esc).join(" | ")+"</div>":"")+
   "<div class='acts'>"+acts+"</div></div>";
}

async function scan(){
  const wallet=$("wallet").value.trim(),chain=$("chain").value,cn=$("chain").selectedOptions[0].text;
  const l=$("log");l.innerHTML="<span>$ ./claim-scanner</span>";l.classList.add("cur");$("out").innerHTML="";bar(0);
  if(!/^0x[0-9a-fA-F]{40}$/.test(wallet)){log("[!] Invalid EVM address. Format: 0x + 40 hex characters.","e");return}
  $("go").disabled=true;
  const api=callApi(wallet,chain);
  for(let i=0;i<STEPS.length;i++){log("[+] "+STEPS[i]);bar(Math.round((i+1)/STEPS.length*95));await sleep(320)}
  const data=await api;let demo=false,reason="",res;
  if(!data){demo=true;reason="local";res=DEMO;
    log("[LOCAL PREVIEW MODE]","w");log("API endpoint unavailable.","w");log("Running demo scanner.","w")}
  else if(data.mode!=="live"){demo=true;reason=data.reason;res=data.results;
    log(reason==="rpc_unavailable"?"[!] Blockchain RPC unavailable.":"[!] No verified claim registry for this network.","w")}
  else res=data.results;
  bar(100);log("SCAN COMPLETE");log("Wallet : "+wallet.slice(0,6)+"..."+wallet.slice(-4));log("Network: "+cn);
  let h="";
  if(demo)h+="<div class='demo'>╔═ DEMO MODE ═╗<br>Blockchain data unavailable for real claims<br>Showing sample scanner output</div>";
  const v=n=>demo?"N/A":(data[n]??0);
  h+="<div class='stats'><div><b>"+v("contractsScanned")+"</b>Contracts scanned</div><div><b>"+v("claimContracts")+"</b>Claim contracts</div><div><b>"+v("eligible")+"</b>Eligible</div></div>";
  if(!res.length)h+="<div class='note'>No claim opportunities found in the registry for this wallet.</div>";
  h+=res.map(r=>card(r,cn)).join("");
  $("out").innerHTML=h;$("go").disabled=false;
}
$("go").onclick=scan;
$("wallet").addEventListener("keydown",e=>{if(e.key==="Enter")scan()});
</script>
</body>
</html>
